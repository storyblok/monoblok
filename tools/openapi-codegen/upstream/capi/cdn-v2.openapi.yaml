                type: object
                properties:
                  link:
                    $ref: '#/components/schemas/Link'
                    description: A link object.
                required:
                  - link
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '429':
          description: Rate limit reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
      x-example-request: version=published&starts_with=articles
  /v2/cdn/spaces/me:
    get:
      summary: Retrieve Current Space
      operationId: getSpace
      description: Retrieve information about the current Storyblok space including cache version, domain, and language configuration.
      tags:
        - Spaces
      parameters:
        - name: version
          in: query
          required: false
          description: 'The content version to retrieve: `draft` or `published`. Default is `published`. Retrieving `draft` requires a preview access token.'
          schema:
            type: string
            enum:
              - draft
              - published
            default: published
            example: published
        - name: token
          in: query
          required: true
          x-speakeasy-ignore: true
          description: A preview or public [access token](https://www.storyblok.com/docs/concepts/access-tokens) configured in a space.
          schema:
            type: string
            example: ask9soUkv02QqbZgmZdeDAtt
      responses:

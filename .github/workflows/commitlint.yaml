name: "Semantic PR Check"

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - edited
      - synchronize

permissions:
  contents: read

jobs:
  main:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      # `pull_request_target` checks out the base branch, so the commitlint
      # config and dependencies come from `main`, not from the PR.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node

      # The PR title becomes the squash commit message, so it has to satisfy
      # the same rules as every other commit, including the scope requirement.
      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint

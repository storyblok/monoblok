tags:
  - name: Assets
    description: Retrieve asset details
    externalDocs:
      description: Assets developer concept
      url: https://storyblok.com/docs/concepts/assets
  - name: Data sources
    description: Retrieve single or multiple datasources
    externalDocs:
      description: Datasources developer concept
      url: https://storyblok.com/docs/concepts/datasources
  - name: Data source entries
    description: Retrieve single or multiple datasource entries
  - name: Experiments
    description: Retrieve running experiments with variants for client-side bucketing
    externalDocs:
      description: Experiments developer concept
      url: https://storyblok.com/docs/concepts/experiments
  - name: Links
    description: Links are a representation of stories and folders. Links contain a limited subset of the information associated with stories, resulting in a reduced size of the API response.
  - name: Spaces
    description: Retrieve space details
    externalDocs:
      description: Spaces manual
      url: https://www.storyblok.com/docs/manuals/spaces
  - name: Stories
    description: Retrieve single or multiple stories
    externalDocs:
      description: Stories manual
      url: https://www.storyblok.com/docs/manuals/stories
  - name: Strata
    description: Search content by meaning
  - name: Tags
    description: Retrieve multiple tags
    externalDocs:
      description: Tags in the Stories manual
      url: https://www.storyblok.com/docs/manuals/stories#tags
  - name: Taxonomy Terms
    description: Retrieve taxonomies and terms

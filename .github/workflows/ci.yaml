name: CI

on:
  push:
    branches:
      - main
      - next
      - alpha
      - beta
      - rc
      - "*-v[0-9]" # mantainance branches (IMPORTANT: naming must be <pkg>-vX (i.e.: react-sdk-v3, richtext-v5, etc)
  pull_request:
    branches:
      - main
      - next
      - alpha
      - beta
      - rc
      - "*-v[0-9]"

env:
  HUSKY: 0
  NX_REJECT_UNKNOWN_LOCAL_CACHE: 0

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - "**"
              - "!**/*.md"
              - "!docs/**"

  build:
    name: build (${{ matrix.name }})
    needs: changes
    environment: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            projects: "*"
          - os: windows-latest
            name: windows
            projects: storyblok
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      # Formatting is owned by the root Vite+ config, so it is checked once for
      # the whole repo rather than per project.
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: pnpm format:check

      # Projects lint themselves in `Check` below. This covers what no project
      # owns: repo config, the release scripts, the agent scripts. The build is
      # needed because `oxlint.config.ts` imports `@storyblok/lint-config`.
      - name: Check root lint
        if: matrix.os == 'ubuntu-latest'
        run: pnpm nx build @storyblok/lint-config && pnpm exec oxlint --disable-nested-config

      # Published packages must reference each other with `workspace:^`, so the
      # range `pnpm publish` writes into the tarball is a floor and not a pin.
      - name: Check workspace protocol
        if: matrix.os == 'ubuntu-latest'
        run: pnpm check:workspace-protocol

      - name: Check
        if: needs.changes.outputs.code == 'true'
        run: pnpm nx run-many --target=build,lint,test,test:types --parallel=3 -p="${{ matrix.projects }}"
        env:
          VITE_ACCESS_TOKEN: ${{ secrets.VITE_ACCESS_TOKEN }}
          VITE_SPACE_ID: ${{ vars.VITE_SPACE_ID }}

  licenses:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      - name: Check Licenses
        run: pnpm nx exec -p="tag:npm:public" -- pnpm -w monoblok license check \$NX_PROJECT_NAME

name: Setup Node
description: Setup node
inputs:
  cache:
    description: Restore/save pnpm and Nx caches
    required: false
    default: "true"
  filter:
    description: Install only this workspace project (pnpm `--filter`)
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - uses: ./.github/actions/cache-monorepo
      if: ${{ inputs.cache == 'true' }}

    - name: Install pnpm
      # Pinned to a commit SHA; the pnpm version itself comes from package.json -> packageManager.
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

    - name: Setup Node.js with cache
      if: ${{ inputs.cache == 'true' }}
      uses: actions/setup-node@v6
      with:
        node-version-file: ".nvmrc"
        cache: "pnpm"

    - name: Setup Node.js without cache
      if: ${{ inputs.cache != 'true' }}
      uses: actions/setup-node@v6
      with:
        node-version-file: ".nvmrc"
        package-manager-cache: false

    - name: Install dependencies
      shell: bash
      env:
        FILTER: ${{ inputs.filter }}
      run: pnpm install --frozen-lockfile ${FILTER:+--filter "$FILTER"}

name: Bundle size

# Builds the PR and its base branch in parallel, measures both with the PR's
# `monoblok size`, and fails on more than 5% growth. Nothing is
# committed as a baseline: the base branch is the baseline.
on:
  pull_request:
    branches:
      - main
      - next
      - alpha
      - beta
      - rc
      - "*-v[0-9]"
    paths-ignore:
      - "**/*.md"
      - "docs/**"

env:
  HUSKY: 0
  NX_REJECT_UNKNOWN_LOCAL_CACHE: 0

permissions:
  contents: read

concurrency:
  group: bundle-size-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      - name: Build
        run: pnpm nx run-many -t build --exclude=storyblok

      - name: Measure
        run: pnpm monoblok size measure --out size-head.json

      - uses: actions/upload-artifact@v4
        with:
          name: size-head
          path: size-head.json
          retention-days: 7

  # A failed base build leaves the PR without a comparison, not failing.
  base:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      - name: Build
        run: pnpm nx run-many -t build --exclude=storyblok

      # Measured in `compare` with the PR's tool, so both builds are measured the same way.
      - uses: actions/upload-artifact@v4
        with:
          name: dist-base
          path: |
            packages/*/package.json
            packages/*/dist
          retention-days: 1

  compare:
    needs: [head, base]
    if: ${{ !cancelled() && needs.head.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      - uses: actions/download-artifact@v4
        with:
          name: size-head

      # Entries are bundled with their dependencies, so the base build needs
      # the base branch's own `node_modules` next to its `dist`.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          path: base
          persist-credentials: false

      - name: Install base
        continue-on-error: true
        working-directory: base
        run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: dist-base
          # upload-artifact drops the common `packages/` prefix, so restore it.
          path: base/packages

      - name: Measure base
        continue-on-error: true
        run: pnpm monoblok size measure --root base --out size-base.json

      # Labels are read when the job runs, not from the event, so adding the
      # label and re-running this job accepts the growth.
      - name: Compare
        env:
          BASE_REF: ${{ github.base_ref }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          accept=()
          if gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name' | grep -x bundle-size-accepted >/dev/null; then
            accept=(--accept)
          fi
          pnpm monoblok size compare size-head.json size-base.json --base-label "$BASE_REF" --markdown bundle-size.md "${accept[@]}"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: bundle-size
          path: bundle-size.md
          if-no-files-found: ignore
          retention-days: 7

  # Posts the report as a PR comment, updated on every push. Kept out of
  # `compare` so the PR's code never runs with a token that can write. Fork PRs
  # get a read-only token, so their report stays in the job summary.
  comment:
    needs: compare
    if: ${{ !cancelled() && needs.compare.result != 'skipped' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Download bundle size report
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: bundle-size

      - name: Post or update PR comment
        if: steps.download.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- monoblok-bundle-size -->';
            const body = fs.readFileSync('bundle-size.md', 'utf8');
            const unchanged = body.includes('No package changed size');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => comment.body?.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else if (!unchanged) {
              // Only PRs that change a package's size get a comment.
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

allOf:
  - $ref: ./base-field.yaml
  - $ref: ./value-field.yaml
  - type: object
    description: Boolean field configuration
    required:
      - type
    properties:
      type:
        type: string
        enum: [boolean]
        description: Field type discriminant
      default_value:
        type: boolean
        description: Default value for the field
      inline_label:
        type: boolean
        description: Whether to display the label next to the toggle

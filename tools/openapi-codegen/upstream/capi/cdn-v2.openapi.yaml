  /v2/cdn/strata/search:
    get:
      summary: Search
      operationId: searchCdnV2StrataIndex
      description: Retrieve stories by meaning through a natural-language query.
      tags:
        - Strata
      parameters:
        - name: q
          in: query
          required: false
          description: The search term. Write it as a natural-language question or phrase.
          schema:
            type: string
            example: pricing
            maxLength: 2000
        - name: version
          in: query
          required: false
          description: 'The content version to retrieve: `draft` or `published`. Default is `published`. Retrieving `draft` requires a preview access token.'
          schema:
            type: string
            enum:
              - draft
              - published
            example: published
            default: published
        - name: limit
          in: query
          required: false
          description: The maximum number of results to return. Default is `25`. Maximum is `100`, or `50` when `starts_with` or `content_type` is set.
          schema:
            type: integer
            example: 25
            default: 25
            minimum: 1
            maximum: 100
        - name: starts_with
          in: query
          required: false
          description: Filter by the story’s `full_slug` to return items starting with the given value. Matches only the default-language slug, so language prefixes (for example, `de/`) and translated slugs return no results.
          schema:
            type: string
            example: docs/
        - name: content_type
          in: query
          required: false
          description: Retrieve stories of a specific content type block. For example, `content_type=page`.
          schema:
            type: string
            example: article
        - name: token
          in: query
          required: true
          x-speakeasy-ignore: true
          description: A preview or public [access token](https://www.storyblok.com/docs/concepts/access-tokens) configured in a space.
          schema:
            type: string
            example: ask9soUkv02QqbZgmZdeDAtt
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    $ref: '#/components/schemas/StrataSearchResults'
                required:
                  - results
        '400':
          description: Invalid version, a q that is not a string or is too long, a filter that is not a string, or a limit that is not a whole number in range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrataErrorResponse'
        '401':
          description: Unauthorized. The token is invalid, or a public token requested draft content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrataErrorResponse'
        '403':
          description: Forbidden. Strata is unavailable for the organization or disabled for the space, a release access token cannot search, or the request type is not allowed for the space (for example a GraphQL request without GraphQL access)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrataErrorResponse'
        '404':
          description: 'Not found. StrataErrorResponse: the token''s space no longer exists. LegacyArrayErrorResponse: the path is unknown or the HTTP method is not supported'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/StrataErrorResponse'
                  - $ref: '#/components/schemas/LegacyArrayErrorResponse'
        '422':
          description: The space is blocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrataErrorResponse'
        '429':
          description: Too many requests. The search backend is throttled, the per-second request limit of the space is reached, or the space is over its monthly API limit (`api_limit_exceeded`). Only the search backend throttle sends a Retry-After header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrataErrorResponse'
        '503':
          description: Search backend temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrataErrorResponse'
      x-example-request: q=can%20I%20send%20my%20order%20back%3F
  /v2/cdn/tags:
    get:
      summary: Retrieve Multiple Tags
      operationId: listTags
      description: Returns an array of tag objects used in a space. The response includes only tags assigned to at least one story.
      tags:
        - Tags
      parameters:
        - name: starts_with
          required: false
          in: query
          schema:
            type: string
            example: blog/posts
          description: Filter by the story’s `full_slug` to return items starting with the given value.
        - name: version
          in: query
          required: false
          description: 'The content version to retrieve: `draft` or `published`. Default is `published`. Retrieving `draft` requires a preview access token.'
          schema:
            type: string
            enum:
              - draft
              - published
            default: published
            example: published
        - name: filter_query
          in: query
          description: Filters tags with the `in`, `not_in`, `like`, and `not_like` operations. Learn more in [Filter Queries](https://www.storyblok.com/docs/api/content-delivery/v2/filter-queries/).
          required: false
          style: deepObject
          explode: true
          schema:
            type: object
            additionalProperties:
              type: object
              properties:
                in:
                  type: string
                not_in:
                  type: string
                like:
                  type: string
                not_like:
                  type: string
        - name: token
          in: query
          required: true
          x-speakeasy-ignore: true
          description: A preview or public [access token](https://www.storyblok.com/docs/concepts/access-tokens) configured in a space.
          schema:
            type: string
            example: ask9soUkv02QqbZgmZdeDAtt
      responses:
        '200':
          description: Tags returned
          content:
            application/json:
              examples:
                tags_returned:
                  value:
                    tags:
                      - name: spicy
                        taggings_count: 5
                      - name: red
                        taggings_count: 3
              schema:
                type: object
                properties:
                  tags:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tag'
                    description: An array of tag objects.
                required:
                  - tags
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '429':
          description: Rate limit reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
      x-example-request: starts_with=articles/

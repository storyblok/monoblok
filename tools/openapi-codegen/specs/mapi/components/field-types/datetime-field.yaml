allOf:
  - $ref: ./base-field.yaml
  - $ref: ./value-field.yaml
  - type: object
    description: Datetime field configuration
    required:
      - type
    properties:
      type:
        type: string
        enum: [datetime]
        description: Field type discriminant
      default_value:
        type: string
        description: Default value for the field
      disable_time:
        type: boolean
        description: Whether to disable time selection (date-only mode)

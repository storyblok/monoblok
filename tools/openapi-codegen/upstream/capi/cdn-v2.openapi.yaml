openapi: 3.1.0
info:
  title: Storyblok Content Delivery API
  version: v2
  description: CDN endpoints for your Storyblok space
  contact:
    name: Storyblok Support
    url: https://support.storyblok.com
    email: support@storyblok.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
paths:
  /v2/cdn/assets/me:
    get:
      summary: Get Signed URL
      operationId: getAsset
      description: Retrieves a signed URL to access a private asset.
      tags:
        - Assets
      parameters:
        - name: filename
          in: query
          schema:
            type: string
            example: filename
          description: Complete URL of the asset.
          required: true
        - name: token
          in: query
          required: true
          x-speakeasy-ignore: true
          description: A preview or public [access token](https://www.storyblok.com/docs/concepts/access-tokens) configured in a space.
          schema:
            type: string
            example: ask9soUkv02QqbZgmZdeDAtt
      responses:
        '200':
          description: Asset returned
          content:
            application/json:
              examples:
                asset_returned:
                  value:
                    asset:
                      alt: Laser cutting machine in action
                      asset_folder_id: 456
                      content_length: 245760
                      content_type: image/jpeg
                      copyright: null
                      created_at: '2025-02-10T08:12:00.000Z'
                      updated_at: '2025-02-10T08:12:00.000Z'
                      expire_at: '2044-04-20T16:01:26.000Z'
                      filename: https://a.storyblok.com/f/10/100x100/b482c4d749/laser-image.jpg
                      focus: null
                      is_private: false
                      signed_url: null
                      title: Laser Image
              schema:
                type: object
                properties:
                  asset:
                    $ref: '#/components/schemas/Asset'
                    description: The asset object received in the response of a get signed URL request.
                required:
                  - asset
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '429':
          description: Rate limit reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
      x-example-request: filename=https://a.storyblok.com/f/44203/x/5231aa9c8a/favicon.ico
  /v2/cdn/datasource_entries:
    get:
      summary: Retrieve Multiple Data Source Entries
      operationId: listDatasourceEntries
      description: Retrieve multiple datasource entries with filtering by data source and dimension.
      tags:
        - Data source entries
      parameters:
        - name: datasource
          in: query
          required: false
          schema:
            type: string
            example: labels
          description: Data source `slug`.
        - name: dimension
          in: query
          required: false
          schema:
            type: string
            example: en
          description: A datasource dimension.
        - name: cv
          in: query
          required: false
          schema:
            type: integer
            example: 1541863983
          description: Cached version Unix timestamp. Learn more in the [Caching concept](https://www.storyblok.com/docs/concepts/caching).
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
            example: 1
          description: Page number in a [paginated](https://www.storyblok.com/docs/api/content-delivery/v2#pagination) response.
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            default: 25
            minimum: 1
            maximum: 1000
            example: 25
          description: The number of items per page in a [paginated](https://www.storyblok.com/docs/api/content-delivery/v2#pagination) response.
        - name: token
          in: query
          required: true
          x-speakeasy-ignore: true
          description: A preview or public [access token](https://www.storyblok.com/docs/concepts/access-tokens) configured in a space.
          schema:
            type: string
            example: ask9soUkv02QqbZgmZdeDAtt
      responses:
        '200':
          description: Datasource_entries returned
          content:
            application/json:
              examples:
                datasource_entries_returned:
                  value:
                    datasource_entries:
                      - id: 1001
                        name: de
                        value: de
                        dimension_value: en
                      - id: 1002
                        name: fr
                        value: fr
                        dimension_value: null
                    cv: 1541863983
              schema:
                type: object
                properties:
                  datasource_entries:
                    type: array
                    items:
                      $ref: '#/components/schemas/DatasourceEntry'
                    description: An array of data source entry objects.
                  cv:
                    type:
                      - integer
                      - 'null'
                    example: 1541863983
                    description: Cached version Unix timestamp. Learn more in the [Caching concept](https://www.storyblok.com/docs/concepts/caching).
                required:
                  - datasource_entries
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '429':
          description: Rate limit reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
      x-example-request: datasource=product-labels&dimension=de
  /v2/cdn/datasources:
    get:
      summary: Retrieve Multiple Data Sources
      operationId: listDatasources
      description: Retrieve all data sources from your Storyblok space with pagination support.
      tags:
        - Data sources
      parameters:
        - name: version
          in: query
          required: false
          description: 'The content version to retrieve: `draft` or `published`. Default is `published`. Retrieving `draft` requires a preview access token.'
          schema:
            type: string
            enum:
              - draft
              - published
            default: published
            example: published
        - name: cv
          in: query
          required: false
          schema:
            type: integer
            example: 1541863983
          description: Cached version Unix timestamp. Learn more in the [Caching concept](https://www.storyblok.com/docs/concepts/caching).
        - name: search
          in: query
          required: false
          schema:
            type: string
            example: labels
          description: Search string.
        - name: by_ids
          in: query
          required: false
          schema:
            type: string
            example: 12312,234234
          description: Retrieve items by `id`. Supports a comma-separated string.
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
            example: 1
          description: Page number in a [paginated](https://www.storyblok.com/docs/api/content-delivery/v2#pagination) response.
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            default: 25
            minimum: 1
            maximum: 1000
            example: 25
          description: The number of items per page in a [paginated](https://www.storyblok.com/docs/api/content-delivery/v2#pagination) response.
        - name: token
          in: query
          required: true
          x-speakeasy-ignore: true
          description: A preview or public [access token](https://www.storyblok.com/docs/concepts/access-tokens) configured in a space.
          schema:
            type: string
            example: ask9soUkv02QqbZgmZdeDAtt
      responses:
        '200':
          description: Datasources returned
          content:
            application/json:
              examples:
                datasources_returned:
                  value:
                    datasources:
                      - id: 1123
                        name: Labels
                        slug: labels
                        dimensions:
                          - id: 1
                            name: en
                            entry_value: en
                            datasource_id: 1123
                        created_at: '2025-02-10T08:12:00.000Z'
                        updated_at: '2025-02-10T08:12:00.000Z'
                      - id: 1124
                        name: Colors
                        slug: colors
                        dimensions: []
                        created_at: '2025-02-11T09:00:00.000Z'
                        updated_at: '2025-02-11T09:00:00.000Z'
                    cv: 1541863983
              schema:
                type: object
                properties:
                  datasources:
                    type: array
                    items:
                      $ref: '#/components/schemas/Datasource'
                    description: An array of data source objects.
                  cv:
                    type:
                      - integer
                      - 'null'
                    example: 1541863983
                    description: Cached version Unix timestamp. Learn more in the [Caching concept](https://www.storyblok.com/docs/concepts/caching).
                required:
                  - datasources
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '429':
          description: Rate limit reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
  /v2/cdn/datasources/{id}:
    get:
      summary: Retrieve a Single Data Source
      operationId: getDatasourceById
      description: Retrieve a single data source by `id`.
      tags:
        - Data sources
      parameters:
        - name: id
          in: path
          required: true
          description: The data source’s ID.
          schema:
            type: string
            example: labels
        - name: version
          in: query
          required: false
          description: 'The content version to retrieve: `draft` or `published`. Default is `published`. Retrieving `draft` requires a preview access token.'
          schema:
            type: string
            enum:
              - draft
              - published
            default: published
            example: published
        - name: cv
          in: query
          required: false
          schema:
            type: integer
            example: 1541863983
          description: Cached version Unix timestamp. Learn more in the [Caching concept](https://www.storyblok.com/docs/concepts/caching).
        - name: token
          in: query
          required: true
          x-speakeasy-ignore: true
          description: A preview or public [access token](https://www.storyblok.com/docs/concepts/access-tokens) configured in a space.
          schema:
            type: string
            example: ask9soUkv02QqbZgmZdeDAtt
      responses:
        '200':
          description: Datasource Found
          content:
            application/json:
              examples:
                datasource_found:
                  value:
                    datasource:
                      id: 1123
                      name: Labels
                      slug: labels
                      dimensions:
                        - id: 1
                          name: en
                          entry_value: en
                          datasource_id: 1123
                      created_at: '2025-02-10T08:12:00.000Z'
                      updated_at: '2025-02-10T08:12:00.000Z'
                    cv: 1541863983
              schema:
                type: object
                properties:
                  datasource:
                    $ref: '#/components/schemas/Datasource'
                    description: A single data source object.
                  cv:
                    type:
                      - integer
                      - 'null'
                    example: 1541863983
                    description: Cached version Unix timestamp. Learn more in the [Caching concept](https://www.storyblok.com/docs/concepts/caching).
                required:
                  - datasource
                  - cv
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: Datasource not found
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                example:
                  - This record could not be found
        '429':
          description: Rate limit reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
  /v2/cdn/experiments:
    get:
      summary: Retrieve Running Experiments
      operationId: listCdnExperimentsV2
      description: Retrieve all running experiments from your Storyblok space.
      tags:
        - Experiments
      parameters:
        - name: cv
          in: query
          required: false
          schema:
            type: integer
            example: 1541863983
          description: Cached version Unix timestamp. Learn more in the [Caching concept](https://www.storyblok.com/docs/concepts/caching).
        - name: token
          in: query
          required: true
          x-speakeasy-ignore: true
          description: A preview or public [access token](https://www.storyblok.com/docs/concepts/access-tokens) configured in a space.
          schema:
            type: string
            example: ask9soUkv02QqbZgmZdeDAtt
      responses:
        '200':
          description: Running experiments returned
          content:
            application/json:
              examples:
                experiments_returned:
                  value:
                    experiments:
                      - id: 501
                        name: homepage_hero_test
                        display_name: Homepage Hero Test
                        story_ids:
                          - 371891025
                        stories:
                          - id: 371891025
                            full_slug: home
                        variants:
                          - name: control
                            display_name: Control
                            public_id: var_abc123def456
                            weight: 50
                            is_control: true
                            story_mappings:
                              - original_story_id: 371891025
                                original_slug: home
                                variant_story_id: null
                                variant_slug: null
                          - name: variant_a
                            display_name: Variant A
                            public_id: var_789ghi012jkl
                            weight: 50
                            is_control: false
                            story_mappings:
                              - original_story_id: 371891025
                                original_slug: home
                                variant_story_id: 371891777
                                variant_slug: home-variant-a
                    cv: 1709500000
              schema:
                type: object
                properties:
                  experiments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Experiment'
                    description: The experiments object.
                  cv:
                    type:
                      - integer
                      - 'null'
                    example: 1709500000
                    description: Cached version Unix timestamp. Learn more in the [Caching concept](https://www.storyblok.com/docs/concepts/caching).
                required:
                  - experiments
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '429':
          description: Rate limit reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
  /v2/cdn/links:
    get:
      summary: Retrieve Multiple Links
      operationId: listLinks
      description: Retrieve a compact representation of stories and folders with optional filtering parameters.
      tags:
        - Links
      parameters:
        - name: starts_with
          in: query
          required: false
          schema:
            type: string
            example: de/beitraege
          description: Filter by the story’s `full_slug` to return items starting with the given value.
        - name: version
          in: query
          required: false
          description: 'The content version to retrieve: `draft` or `published`. Default is `published`. Retrieving `draft` requires a preview access token.'
          schema:
            type: string
            enum:
              - draft
              - published
            default: published
            example: published
        - name: cv
          in: query
          required: false
          schema:
            type: integer
            example: 1541863983
          description: Cached version Unix timestamp. Learn more in the [Caching concept](https://www.storyblok.com/docs/concepts/caching).
        - name: include_dates
          in: query
          required: false
          schema:
            type: string
            example: '1'
          description: Include or exclude the `created_at`, `updated_at` and `published_at` fields. To include these date fields in the response, set to `1`. To exclude them, set to `0` or omit the parameter.
        - name: by_uuid
          in: query
          required: false
          schema:
            type: string
            example: a78b2116-c26d-4d23-9cbe-fec477847b0e
          description: Filter links by `uuid`.
        - name: with_parent
          in: query
          required: false
          schema:
            type: string
            example: '0'
          description: To return links from a specific folder, filter by folder `id`. To return stories outside a folder, set to `0`.
        - name: paginated
          in: query
          required: false
          schema:
            type: string
            example: '0'
          description: To enable a [paginated](https://www.storyblok.com/docs/api/content-delivery/v2#pagination) response, set to `1`.
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
            example: 1
          description: Page number in a [paginated](https://www.storyblok.com/docs/api/content-delivery/v2#pagination) response.
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            default: 25
            minimum: 1
            maximum: 1000
            example: 25
          description: The number of items per page in a [paginated](https://www.storyblok.com/docs/api/content-delivery/v2#pagination) response.
        - name: token
          in: query
          required: true
          x-speakeasy-ignore: true
          description: A preview or public [access token](https://www.storyblok.com/docs/concepts/access-tokens) configured in a space.
          schema:
            type: string
            example: ask9soUkv02QqbZgmZdeDAtt
      responses:
        '200':
          description: Links returned
          content:
            application/json:
              examples:
                links_returned:
                  value:
                    links:
                      a78b2116-c26d-4d23-9cbe-fec477847b0e:
                        id: 371891025
                        uuid: a78b2116-c26d-4d23-9cbe-fec477847b0e
                        slug: home
                        path: null
                        real_path: /home
                        name: Home
                        published: true
                        parent_id: 0
                        is_folder: false
                        is_startpage: true
                        position: 0
                        published_at: '2025-01-15T09:32:10.000Z'
                        created_at: '2025-01-15T09:30:00.000Z'
                        updated_at: '2025-06-02T14:12:05.000Z'
                        alternates: []
                      de:
                        id: 371890998
                        uuid: 2c6b9a4a-2b9c-4d3f-9e21-2a6b6a2f0b3d
                        slug: de
                        path: null
                        real_path: /de
                        name: de
                        published: false
                        parent_id: 0
                        is_folder: true
                        is_startpage: false
                        position: 1
                        published_at: null
                        created_at: '2025-01-15T09:30:00.000Z'
                        updated_at: '2025-01-15T09:30:00.000Z'
                        alternates: []
              schema:
                type: object
                properties:
                  links:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/Link'
                    description: An object that contains link objects. Each key represents a story or folder UUID.
                required:
                  - links
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '429':
          description: Rate limit reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
      x-example-request: version=published&starts_with=articles

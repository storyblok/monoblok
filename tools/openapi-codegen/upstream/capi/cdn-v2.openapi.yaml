      items:
        $ref: '#/components/schemas/StrataSearchHit'
      example:
        - excerpt: You can return any item within 30 days...
          score: 0.89
          story:
            id: 1001
            slug: pricing/returns
            name: Returns
        - excerpt: Refunds are processed within 5 business days...
          score: 0.81
          story:
            id: 1044
            slug: faq
            name: FAQ

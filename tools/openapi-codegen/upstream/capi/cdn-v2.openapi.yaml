    TaxonomyTerm:
      type: object
      description: An object that contains a taxonomy.
      properties:
        id:
          type: string
          description: The taxonomy’s ID.
          example: '200948619034658'
        display_name:
          type: string
          description: The taxonomy’s name.
          example: Electronics
        name:
          type: string
          description: The taxonomy’s technical name.
          example: electronics
        description:
          type:
            - string
            - 'null'
          description: The taxonomy’s description.
        parent_id:
          type:
            - string
            - 'null'
          description: The top-level term’s ID.
          example: '200948619034657'
        last_author:
          type:
            - object
            - 'null'
          description: An object that contains the details of user who created the term.
          properties:
            id:
              type: integer
              description: The user’s numeric ID.
              example: 123
            userid:
              type: string
              description: The user’s username or email address.
              example: info@storyblok.com
            friendly_name:
              type: string
              description: The user’s display name.
              example: John Doe

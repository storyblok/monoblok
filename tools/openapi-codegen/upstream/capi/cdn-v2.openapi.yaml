  /v2/cdn/stories/{id}:
    get:
      summary: Retrieve a Single Story
      operationId: getStoryById
      description: Retrieve a single story by full slug, ID, or UUID. Includes parameters for resolving links and relations.
      tags:
        - Stories
      parameters:
        - name: id
          in: path
          required: true
          description: The story’s `id`, `uuid`, or `full_slug`.
          schema:
            type: string
            example: startpage
        - name: find_by
          required: false
          in: query
          description: Required when using the story `uuid` as a path parameter.
          schema:
            type: string
            example: uuid
        - name: version
          in: query
          required: false
          description: 'The content version to retrieve: `draft` or `published`. Default is `published`. Retrieving `draft` requires a preview access token.'
          schema:
            type: string
            enum:
              - draft
              - published
            default: published
            example: published
        - name: resolve_links
          in: query
          required: false
          description: |-
            Resolve [link fields](https://www.storyblok.com/docs/concepts/fields#link).
            The `links` property of the response includes resolved links:
            - `link`: provides access to additional information, such as a linked story’s `full_slug`, `path`, `parent_id`, `is_folder`, `published`, `is_startpage`, `position`, `alternates`, `real_path`, and more.
            - `url`: provides the minimum amount of information. Use when you only need the path of a linked story.
            - `story`: resolves and returns the complete story object of a linked story.
          schema:
            type: string
            enum:
              - story
              - url
              - link
            example: story
        - name: resolve_links_level
          required: false
          in: query
          description: Resolve up to two levels of links.
          schema:
            type: integer
            enum:
              - 1
              - 2
            default: 1
            example: 1
        - name: resolve_relations
          required: false
          in: query
          description: |-
            Used to resolve [referenced stories](https://www.storyblok.com/docs/concepts/references). Resolved stories appear in the `rels` property of the response.

            A single request can resolve up to 50 stories. Afterward, all story `UUID` appear in the `rel_uuids` property of the response and need to resolve in subsequent API requests.

            To resolve the stories selected in one field, provide the technical name of the immediate parent component of the field, followed by a `.` and the field name. To resolve the stories selected in multiple fields, provide a comma-separated string.

            Example: `resolve_relations=page.author,page.categories`.
          schema:
            type: string
            example: page.author,page.categories
        - name: from_release
          required: false
          in: query
          schema:
            type: string
            example: '1'
          description: Access a story version in a specific release by providing the release ID.

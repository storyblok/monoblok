  /v2/cdn/stories:
    get:
      summary: Retrieve Multiple Stories
      operationId: listStories
      description: Retrieve multiple stories from Storyblok with filtering, pagination, sorting, and relation resolution options.
      tags:
        - Stories
      parameters:
        - name: version
          in: query
          required: false
          description: 'The content version to retrieve: `draft` or `published`. Default is `published`. Retrieving `draft` requires a preview access token.'
          schema:
            type: string
            enum:
              - draft
              - published
            default: published
            example: published
        - name: cv
          in: query
          schema:
            type: integer
            example: 1234
          required: false
          description: Cached version Unix timestamp. Learn more in the [Caching concept](https://www.storyblok.com/docs/concepts/caching).
        - name: starts_with
          required: false
          in: query
          schema:
            type: string
            example: blog/posts
          description: Filter by the story’s `full_slug` to return items starting with the given value.
        - name: search_term
          required: false
          in: query
          schema:
            type: string
            example: name
          description: Search for any string in stories. The response contains all stories where the string appears anywhere in the name, slug, full slug, or content object. This includes UUIDs, field values, asset file names, and rich text nodes and attributes, such as "bold". Combine this parameter with the `version` parameter to filter by `draft` or `published` stories.
        - name: sort_by
          required: false
          in: query
          schema:
            type: string
            example: created_at:desc
          examples:
            sort_by_date:
              summary: Sort by date
              value: created_at:desc
            content_meta_data:
              summary: Sort by Content Metadata
              value: content.meta_description:asc
            chain_sorting:
              summary: Sort by chaining with commas
              value: name:desc,slug:asc
            null_first:
              summary: Sort by keeping null first
              value: path:desc:nulls_first
          description: |-
            Sort stories in ascending or descending order by a specific property. Possible properties are all default story properties and any custom fields defined in the schema of the story type.

            Sort default story properties like so:
            - `sort_by=created_at:desc`
            - `sort_by=slug:asc`

            Sort custom fields can like so:
            - `sort_by=content.meta_description:asc`
            - `sort_by=content.event_title:desc`

            By default, all sorted custom fields are strings. To sort custom fields with numeric values, specify floats or integers:
            - `sort_by=content.price:asc:float`
            - `sort_by=content.event_number:asc:int`

            Chain different sorts with commas: `sort_by=name:desc,slug:asc`.

            Sort values and set the `null` or `empty` ones first or last:
            - `sort_by=path:desc:nulls_first`
            - `sort_by=path:desc:nulls_last`.

            `nulls_last` is the default behavior.
        - name: per_page
          in: query
          description: The number of items per page in a [paginated](https://www.storyblok.com/docs/api/content-delivery/v2#pagination) response.
          required: false
          schema:
            type: integer
            default: 25
            minimum: 0
            maximum: 100
            example: 25
        - name: page
          required: false
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
            maximum: 100000
            example: 1
          description: Page number in a [paginated](https://www.storyblok.com/docs/api/content-delivery/v2#pagination) response.
        - name: by_slugs
          required: false
          in: query
          schema:
            type: string
            example: posts/*
          examples:
            explicit_slugs:
              summary: Two explicit slugs
              value: posts/my-third-post,posts/my-second-post
            wildcard_slugs:
              summary: Wildcard prefix
              value: posts/*
          description: |-
            Retrieve stories by comma-separated `full_slug`. For example, `by_slugs=posts/third-post,posts/second-post`.

            You can use `*` as a wildcard. For example, `by_slugs=posts/*`.
        - name: excluding_slugs
          required: false
          in: query
          schema:
            type: string
            example: homepage
          description: |-
            Exclude stories by comma-separated `full_slug`. For example, `excluding_slugs=posts/third-post,posts/second-post`.

            You can use `*` as a wildcard. For example, `excluding_slugs=posts*`.
        - name: published_at_gt
          required: false
          in: query
          description: Retrieve stories published after the specified date. Supports ISO 8601.
          schema:
            type: string
            format: date-time
            example: '2025-07-16T08:00:00Z'
        - name: published_at_gte
          required: false
          in: query
          description: Retrieve stories published on or after the specified date. Supports ISO 8601.
          schema:
            type: string
            format: date-time
            example: '2025-07-16T08:00:00Z'
        - name: published_at_lt
          required: false
          in: query
          description: Retrieve stories published before the specified date. Supports ISO 8601.
          schema:
            type: string
            example: '2025-07-16T08:00:00Z'
        - name: published_at_lte
          required: false

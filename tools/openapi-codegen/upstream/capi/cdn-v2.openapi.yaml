components:
  schemas:
    Alternate:
      type: object
      properties:
        path:
          type: string
          description: Translated story slug (learn more about the [Translatable Slugs app](https://www.storyblok.com/docs/apps/translatable-slugs)).
          example: /home
        name:
          type: string
          description: Translated story name (learn more about the [Translatable Slugs app](https://www.storyblok.com/docs/apps/translatable-slugs)).
          example: Home
        lang:
          type: string
          description: The story’s language code.
          example: en
        published:
          type: boolean
          description: Returns `true` if story language version is currently published.
          example: true
        translated_slug:
          type: string
          description: Translated story slug (learn more about the [Translatable Slugs app](https://www.storyblok.com/docs/apps/translatable-slugs)).
          example: home
      required:
        - path
        - name
        - lang
        - published
        - translated_slug
    ExperimentBase:
      type: object
      properties:
        id:
          type: integer
          description: Numeric ID of the experiment.
          example: 123
        name:
          type: string
          description: Internal name (lowercase letters, numbers, and underscores).
          example: homepage_hero_test
        display_name:
          type: string
          description: Human-readable display name.
          example: Homepage Hero Test
        story_ids:
          type: array
          description: IDs of [stories](https://www.storyblok.com/docs/api/content-delivery/v2/stories/retrieve-a-single-story) assigned to the experiment.
          items:
            type: integer
            example: 101
          example:
            - 101
            - 202
        variants:
          type: array
          description: Variants belonging to the experiment.
          items:
            $ref: '#/components/schemas/ExperimentVariant'
      required:
        - id
        - name
        - display_name
        - story_ids
        - variants
    ExperimentVariant:
      type: object
      properties:
        name:
          type: string
          description: Internal name (lowercase letters, numbers, and underscores).
          example: control
        display_name:
          type: string
          description: Human-readable display name.
          example: Control
        public_id:
          type: string
          description: Public identifier for stable bucketing.
          example: var_abc123def456
        weight:
          type: integer
          description: Traffic weight percentage (0-100).
          example: 50
        is_control:
          type: boolean
          description: Returns `true` if the variant is the control.
          example: true
        story_mappings:
          type: array
          description: Mappings between original stories and their variant copies.
          items:
            type: object
            properties:
              original_story_id:
                type: integer
                description: Numeric ID of the original [story](https://www.storyblok.com/docs/api/content-delivery/v2/stories/retrieve-a-single-story).
                example: 123
              original_slug:
                type:
                  - string
                  - 'null'
                description: Slug of the original story.
                example: home
              variant_story_id:
                type:
                  - integer
                  - 'null'
                description: Numeric ID of the variant story copy.
                example: 456
              variant_slug:
                type:
                  - string
                  - 'null'
                description: Slug of the variant story copy.
                example: home-variant-a
            required:
              - original_story_id
              - original_slug
              - variant_story_id
              - variant_slug
      required:
        - name
        - display_name
        - public_id
        - weight
        - is_control
        - story_mappings
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error message
          example: There is an error
        error_code:
          type: string
          description: Stable, machine-readable reason the request was denied. Present on role and plan/quota denials so clients can branch without matching on `error`.
          example: org_role_forbidden
      required:
        - error
    LegacyArrayErrorResponse:
      type: array
      description: Array of message strings. Returned for an unknown path.
      items:
        type: string
      example:
        - This record could not be found
    Link:
      type: object
      properties:
        id:
          type: integer
          description: Story or folder ID.
          example: 123
        uuid:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
          description: Story or folder UUID.
        slug:
          type: string
          description: Story or folder `full_slug`.
          example: website-a/home
        path:
          type:
            - string
            - 'null'
          description: Real path defined in the story’s entry configuration. Learn more in the [Visual Editor concept](https://www.storyblok.com/docs/concepts/visual-editor)).
          example: the-real-path
        real_path:
          type:
            - string
            - 'null'
          description: Either the full slug of the story or folder with a leading `/`, or the value of the real path defined in the story’s entry configuration with a leading `/`.
          example: /the-real-path
        name:
          type: string
          description: Story or folder name.
          example: Home
        published:
          type: boolean
          description: Returns `true` if the story is currently published.
          example: true
        parent_id:
          type: integer
          description: Parent folder ID.
          example: 123
        is_folder:
          type: boolean
          description: Returns `true` if the item is a folder.
          example: true
        is_startpage:
          type: boolean
          description: Returns `true` if the story is the folder’s root.
          example: true
        position:
          type: integer
          description: Numeric representation of the story’s position in the folder. Users [can change](https://www.storyblok.com/docs/manuals/stories#folders) this property in the **Content** tab.
          example: 2
        published_at:
          type:
            - string
            - 'null'
          format: date-time
          example: '2025-07-09T14:35:26.851Z'
          description: Latest publication timestamp. Supports ISO 8601.
        created_at:
          type:
            - string
            - 'null'
          format: date-time
          example: '2025-07-09T14:35:26.851Z'
          description: Creation timestamp. Supports ISO 8601.
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
          example: '2025-07-09T14:35:26.851Z'
          description: Latest update timestamp. Supports ISO 8601.
        alternates:
          type: array
          description: |-
            An array that contains objects correlating to the language versions defined using [field-level translation](https://www.storyblok.com/docs/concepts/internationalization#field-level-translation).

             The `alternates` parameter is different from the story alternates defined in the [Dimensions app](https://www.storyblok.com/docs/apps/dimensions) when using
             [folder-level translation](https://www.storyblok.com/docs/concepts/internationalization#folder-level-translation).
          items:
            $ref: '#/components/schemas/Alternate'
      required:
        - id
        - uuid
        - slug
        - name
        - published
        - parent_id
        - is_folder
        - is_startpage
        - position
    LinkWithFullSlug:
      allOf:
        - $ref: '#/components/schemas/Link'
        - type: object
          properties:
            full_slug:
              type: string
              description: The story’s full slug, including parent folder and language paths.
              example: es/posts/mi-casa
          required:
            - full_slug
    Dimension:
      type: object
      properties:
        id:
          type: integer
          description: Dimension ID.
          example: 1
        name:
          type: string
          description: Dimension name.
          example: Width
        entry_value:
          type: string
          description: Dimension value.
          example: a language code
        datasource_id:
          type: integer
          example: 1123
          description: ID of the data source that contains this dimension.
        created_at:
          type: string
          format: date-time
          example: '2025-07-09T14:35:26.851Z'
          description: Creation timestamp. Supports ISO 8601.
        updated_at:
          type: string
          format: date-time
          example: '2025-07-09T14:35:26.851Z'
          description: Latest update timestamp. Supports ISO 8601.
      required:
        - id
        - name
        - entry_value
    RateLimitError:
      type: object
      properties:
        error:
          type: string
          description: Rate limit reached
          example: Rate limit of 50 request per second has been reached. Retry later.
      required:
        - error
    ResolvedLinkUrl:
      type: object
      description: Linked story or folder in the `links` array when `resolve_links` is `url`.
      properties:
        id:
          type: integer
          description: Story or folder ID.
          example: 123
        uuid:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
          description: Story or folder UUID.
        name:
          type: string
          description: Story or folder name.
          example: Mi casa
        slug:
          type: string
          description: Story or folder slug.
          example: mi-casa
        full_slug:
          type: string
          description: The story’s full slug, including parent folder and language paths.
          example: es/posts/mi-casa
        url:
          type: string
          description: The `real_path` defined in the story or folder’s Config, or the `full_slug`.
          example: es/posts/mi-casa
      required:
        - id
        - uuid
        - name
        - slug
        - full_slug
        - url
    StrataErrorResponse:
      type: object
      description: 'Error shape used by every Strata endpoint: management, CDN v1 and CDN v2. Check `code` to detect the error type. Do not match on `message`: its wording can change.'
      properties:
        error:
          type: object
          properties:
            message:
              type: string
              description: Human-readable description of the error.
              example: no such run
            code:
              type: string
              description: A fixed error code for this failure. `credits_exceeded` is reserved and no v1 endpoint returns it. `strata_space_limit_reached` means the organization is at its maximum number of Strata-enabled spaces. `writes_disabled` means writes are off for maintenance. `api_limit_exceeded` means the space is over its monthly API request limit. `org_inactive` means the organization is disabled. `insufficient_scope` means the token lacks a required scope. `invalid_json` means the request body is not valid JSON. `invalid_request` means the database rejected the query.
              enum:
                - invalid_argument
                - not_found
                - feature_disabled
                - ai_disabled
                - forbidden
                - blocked
                - credits_exceeded
                - strata_space_limit_reached
                - already_running
                - not_running
                - rate_limited
                - bad_request
                - error
                - unauthorized
                - writes_disabled
                - api_limit_exceeded
                - org_inactive
                - insufficient_scope
                - invalid_json
                - invalid_request
              example: not_found
            details:
              type:
                - object
                - 'null'
              description: Extra structured data about the error.
              additionalProperties: true
              example: null
            timestamp:
              type: string
              format: date-time
              description: When the error happened, in ISO 8601 format.
              example: '2026-08-02T10:30:00Z'
          required:
            - message
            - code
            - details
            - timestamp
      required:
        - error
    StrataSearchHit:
      type: object
      description: A search result object for one passage of story content that matches the search term.
      properties:
        excerpt:
          type: string
          description: The passage of story content that matches the search term.
          example: Our pricing scales with usage.
        score:
          type: number
          format: float
          description: How closely the result matches the search term. A higher value means a closer match.
          example: 0.92
        story:
          type: object
          description: The story that contains the matching passage.
          properties:
            id:
              type: integer
              description: Numeric ID of the story.
              example: 1001
            slug:
              type: string
              description: Full slug of the story.
              example: pricing
            name:
              type: string
              description: Name of the story.
              example: Pricing
          required:
            - id
            - slug
            - name
      required:
        - excerpt
        - score
        - story
    StrataSearchResults:
      type: array

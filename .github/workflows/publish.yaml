name: Publish

on:
  workflow_dispatch:

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write # needed for OIDC trusted publishing
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0
          persist-credentials: false

      - uses: ./.github/actions/setup-node
        with:
          cache: "false"

      - name: Determine npm tag
        id: npm-tag
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          if [ "$BRANCH_NAME" = "main" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            echo "tag=$BRANCH_NAME" >> $GITHUB_OUTPUT
          fi

      - name: Build packages
        run: pnpm nx run-many -p="tag:npm:public" -t build

      - name: Print Environment Info
        run: pnpm nx report

      # Compute the list of projects to publish. Always filter by each
      # package's `release.branches` so alpha-only packages can never be
      # published to `latest` from main (or to `beta`/`next` from the wrong
      # branch), regardless of how versioning was performed.
      #
      # On main: publish every eligible package. `nx release publish` is a
      # no-op for versions already on npm, so this restores catch-up semantics
      # if a previous release cycle skipped the publish step.
      #
      # On prereleases: intersect eligibility with the packages bumped in the
      # latest `chore(release): publish` commit. The intersection is needed
      # as a workaround for nx publish bugs that would otherwise try to
      # publish unrelated packages:
      #   - https://github.com/nrwl/nx/issues/34000
      #   - https://github.com/nrwl/nx/issues/27822
      - name: Determine projects to publish
        id: detect-packages
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          ELIGIBLE=$(node tools/release-branches.mjs "$BRANCH_NAME")
          echo "Eligible on $BRANCH_NAME: $ELIGIBLE"

          if [ "$BRANCH_NAME" = "main" ]; then
            echo "packages=$ELIGIBLE" >> "$GITHUB_OUTPUT"
          else
            RELEASE_COMMIT=$(git log --grep='^chore(release): publish' --format=%H -1)
            echo "Release commit: $RELEASE_COMMIT"
            BUMPED=$(git log -1 --format=%B "$RELEASE_COMMIT" | grep '^- project:' | awk '{print $3}' | paste -sd ',' -)
            echo "Bumped in release commit: $BUMPED"
            PACKAGES=$(ELIGIBLE="$ELIGIBLE" BUMPED="$BUMPED" node -e '
              const eligible = new Set((process.env.ELIGIBLE || "").split(",").filter(Boolean));
              const bumped = (process.env.BUMPED || "").split(",").filter(Boolean);
              process.stdout.write(bumped.filter(p => eligible.has(p)).join(","));
            ')
            echo "Packages to publish: $PACKAGES"
            echo "packages=$PACKAGES" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Publish packages
        env:
          NPM_TAG: ${{ steps.npm-tag.outputs.tag }}
          PACKAGES: ${{ steps.detect-packages.outputs.packages }}
        run: |
          if [ -n "$PACKAGES" ]; then
            pnpm nx release publish --excludeTaskDependencies --tag="$NPM_TAG" --projects="$PACKAGES"
          else
            echo "No packages to publish"
          fi
        shell: bash

      # Tell the docs platform which packages with docs/reference.md were
      # published. It reads the docs from the npm tarball and opens a PR with
      # the regenerated pages. See `docs/docs-platform.md`.
      # The packages are already on npm, so a failed notification must not fail
      # the release or skip the jobs after it.
      - name: Notify the docs platform
        if: steps.detect-packages.outputs.packages != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.DOCS_PLATFORM_DISPATCH_TOKEN }}
          NPM_TAG: ${{ steps.npm-tag.outputs.tag }}
          PACKAGES: ${{ steps.detect-packages.outputs.packages }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::DOCS_PLATFORM_DISPATCH_TOKEN isn't set; the docs platform wasn't notified."
            exit 0
          fi
          for dir in packages/*/; do
            [ -f "$dir/docs/reference.md" ] || continue
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            case ",$PACKAGES," in *",$name,"*) ;; *) continue ;; esac
            echo "Notifying the docs platform: $name@$version ($NPM_TAG)"
            gh api repos/storyblok/storyblok-docs-platform/dispatches \
              -f event_type=library-published \
              -f "client_payload[package]=$name" \
              -f "client_payload[version]=$version" \
              -f "client_payload[dist_tag]=$NPM_TAG" ||
              echo "::warning::Couldn't notify the docs platform about $name@$version."
          done
        shell: bash

  # Syncs the blueprints to their template repos once the packages are on npm, so the sync resolves
  # `latest` to what was just published. Every publish on main asks for it, including one that had
  # nothing new to publish: the approval is where a run is rejected. See blueprints/README.md.
  sync-blueprints:
    name: Sync blueprints
    needs: publish
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: ./.github/workflows/sync-blueprints.yaml

packages:
  - packages/*
  - packages/*/playground
  - packages/*/playground/*
  - tools/*

# Shared toolchain. Every package that uses one of these should reference it as
# `catalog:` so a bump is a one-line change here instead of a repo-wide sweep.
catalog:
  "@playwright/test": 1.62.1
  "@types/node": ^24.11.0
  "@vitest/coverage-v8": ^4.1.10
  dotenv: ^17.3.1
  jiti: 2.7.0
  jsdom: ^27.1.0
  msw: ^2.12.9
  oxlint: 1.76.0
  pathe: ^2.0.3
  publint: ^0.3.22
  tsx: ^4.21.0
  typescript: 6.0.3
  vite-plugin-dts: ^5.0.3
  vitest: ^4.1.10
  zod: ^4.3.6

# Named catalogs pin the framework version matrix the playgrounds exist to
# cover. Keep them separate from `catalog:` so bumping the toolchain never
# silently drags a legacy playground onto a newer framework.
catalogs:
  # Legacy React 18 / Next 13 playgrounds. These deliberately stay behind.
  react18:
    "@types/react": ^18.3.4
    react: ^18.3.1
    react-dom: ^18.3.1
  next13:
    eslint: ^8.57.0
    eslint-config-next: ^14.2.28
    next: ^13.5.7

  # Current React 19 / Next 16 line.
  #
  # Pin a single React 19 types version so the React playgrounds and the
  # workspace-linked @storyblok/react resolve one @types/react copy. Must track
  # what Next.js expects (its generated route types reference the global React
  # namespace), otherwise a duplicate ReactNode causes type errors.
  react19:
    "@types/react": 19.2.3
    "@types/react-dom": 19.2.3
    react: ^19.2.4
    react-dom: ^19.2.4
  next16:
    next: ^16.0.0

# Route newly added dependencies into the catalog automatically, and warn (not
# fail) when a package asks for a version the catalog does not carry — the
# version-matrix playgrounds legitimately need their own pins.
catalogMode: prefer

injectWorkspacePackages: true
syncInjectedDepsAfterScripts:
  - build

# Supply chain hardening. Rationale, where each control acts, and the escape
# hatches are in adr/0015-pnpm-supply-chain-hardening.md.
strictDepBuilds: true

# May run install scripts; the workspace needs their build output.
onlyBuiltDependencies:
  - cypress
  - esbuild

# Ask to run install scripts but do not need to. New packages go here by
# default: `pnpm approve-builds '!<pkg>'`.
ignoredBuiltDependencies:
  - "@parcel/watcher"
  - "@swc/core"
  - lmdb
  - msgpackr-extract
  - msw
  - nx
  - sharp
  - unrs-resolver

# 24h. Resolution-time only; does not re-check a frozen lockfile.
minimumReleaseAge: 1440

# Resolution-time only; for false positives prefer `trustPolicyIgnoreAfter`.
trustPolicy: no-downgrade

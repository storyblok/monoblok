allOf:
  - $ref: ./base-field.yaml
  - $ref: ./value-field.yaml
  - type: object
    description: Text field configuration
    required:
      - type
    properties:
      type:
        type: string
        enum: [text]
        description: Field type discriminant
      default_value:
        type: string
        description: Default value for the field
      max_length:
        oneOf:
          - type: integer
          - type: string
        description: |
          Maximum length of the input. The schema form persists the number
          input's raw value, so a space can hold `"60"` just as legitimately as
          `60`. Coerce before comparing.
      maxlength:
        type: integer
        description: Maximum length for text fields (legacy alias for max_length)
      minlength:
        type: integer
        description: Minimum length for text fields
      size:
        type: string
        description: Field size (small, medium, large)
      rtl:
        type: boolean
        description: Whether to enable right-to-left text direction
